<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFF8D6"/>
    <stop offset="35%" stop-color="#F3CC62"/>
    <stop offset="70%" stop-color="#D4A017"/>
    <stop offset="100%" stop-color="#FFF0B0"/>
  </linearGradient>

  <filter id="shadow">
    <feDropShadow dx="2" dy="3" stdDeviation="3"/>
  </filter>
</defs>

<!-- White background -->
<rect width="512" height="512" fill="white"/>

<!-- Rounded square border -->
<rect x="18" y="18" width="476" height="476" rx="72" ry="72"
      fill="white" stroke="url(#gold)" stroke-width="10"/>

<!-- Inner gold dotted border -->
<g fill="#D4A017">
  <circle cx="70" cy="70" r="4"/>
  <circle cx="110" cy="70" r="4"/>
  <circle cx="150" cy="70" r="4"/>
  <circle cx="190" cy="70" r="4"/>
  <circle cx="230" cy="70" r="4"/>
  <circle cx="270" cy="70" r="4"/>
  <circle cx="310" cy="70" r="4"/>
  <circle cx="350" cy="70" r="4"/>
  <circle cx="390" cy="70" r="4"/>
  <circle cx="430" cy="70" r="4"/>

  <circle cx="70" cy="442" r="4"/>
  <circle cx="110" cy="442" r="4"/>
  <circle cx="150" cy="442" r="4"/>
  <circle cx="190" cy="442" r="4"/>
  <circle cx="230" cy="442" r="4"/>
  <circle cx="270" cy="442" r="4"/>
  <circle cx="310" cy="442" r="4"/>
  <circle cx="350" cy="442" r="4"/>
  <circle cx="390" cy="442" r="4"/>
  <circle cx="430" cy="442" r="4"/>
</g>

<!-- Faded compass star -->
<g opacity="0.12" fill="#D4A017">
  <polygon points="256,95 278,230 256,417 234,230"/>
  <polygon points="95,256 230,234 417,256 230,278"/>
  <polygon points="145,145 250,220 367,367 220,250"/>
  <polygon points="367,145 292,250 145,367 250,220"/>
</g>

<!-- SRL text -->
<text x="256" y="320"
      text-anchor="middle"
      font-family="Times New Roman, serif"
      font-size="185"
      font-weight="bold"
      fill="url(#gold)"
      stroke="#000"
      stroke-width="3"
      filter="url(#shadow)">SRL</text>
</svg>
