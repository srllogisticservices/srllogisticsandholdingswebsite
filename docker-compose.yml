services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data:/data
      - ./backups:/backups
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=sqlite:////data/srl.db
      - BACKUP_DIR=/backups
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=SRLAdmin2026!
      - ADMIN_DISPLAY_NAME=System Administrator
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
